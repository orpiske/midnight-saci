{{- if not .Values.auth.existingSecret }}
{{- $name := include "saci.authSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "saci.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.auth.secretKey) }}
  {{ .Values.auth.secretKey }}: {{ index $existing.data .Values.auth.secretKey }}
  {{- else }}
  {{ .Values.auth.secretKey }}: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
