# What the backend needs to launch workers (docs/kubernetes.md#permissions),
# in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "saci.fullname" . }}-launcher
  labels:
    {{- include "saci.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "saci.fullname" . }}-launcher
  labels:
    {{- include "saci.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "saci.fullname" . }}-launcher
subjects:
  - kind: ServiceAccount
    name: {{ include "saci.backendServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
