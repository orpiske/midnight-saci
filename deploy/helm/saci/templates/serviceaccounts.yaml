apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "saci.backendServiceAccount" . }}
  labels:
    {{- include "saci.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- if .Values.worker.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "saci.workerServiceAccount" . }}
  labels:
    {{- include "saci.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
