[workspace]
resolver = "3"
members = [
    "crates/saci-core",
    "crates/saci-worker",
    "crates/saci-backend",
    "crates/saci-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/orpiske/midnight-saci"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

saci-core = { version = "0.1.0", path = "crates/saci-core" }
saci-worker = { version = "0.1.0", path = "crates/saci-worker" }
saci-backend = { version = "0.1.0", path = "crates/saci-backend" }
