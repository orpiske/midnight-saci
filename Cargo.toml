[workspace]
resolver = "3"
members = [
    "crates/saci-core",
    "crates/saci-mcp",
    "crates/saci-worker",
    "crates/saci-backend",
    "crates/saci-cli",
    "crates/saci-testkit",
    "crates/saci-script-runner",
    "crates/saci-julia",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/orpiske/midnight-saci"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1.12"
http = "1.4"
# Checks API responses against docs/openapi.yaml in tests.
jsonschema = { version = "0.59", default-features = false }
# MCP SDK; must stay on the major version rig-rmcp uses (see docs/mcp.md).
rmcp = { version = "2.2", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
clap = { version = "4.6", features = ["derive"] }
# ONNX Runtime for saci-julia. Pinned exactly to the version rig's optional
# fastembed backend uses: Cargo allows one ONNX Runtime link per lockfile.
# Each crate selects how ONNX Runtime is linked.
ort = { version = "=2.0.0-rc.9", default-features = false }
# Agent library; see docs/agent-library.md. Pinned exactly: its API moves quickly.
rig = { version = "=0.44.0", default-features = false, features = ["agent", "reqwest", "rustls", "rmcp", "typesafeai"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
tempfile = "3.27"
# The Julia 1 tokenizer. `unstable_wasm` selects the pure-Rust regex engine,
# the same build as the reference encoder in Julia-1-ONNX.
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
thiserror = "2.0"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "fs", "net", "signal", "io-std"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4", "serde"] }

saci-core = { version = "0.1.0", path = "crates/saci-core" }
saci-mcp = { version = "0.1.0", path = "crates/saci-mcp" }
saci-worker = { version = "0.1.0", path = "crates/saci-worker" }
saci-backend = { version = "0.1.0", path = "crates/saci-backend" }
saci-testkit = { version = "0.1.0", path = "crates/saci-testkit" }

# Lint enablement adopted from the Wanaku Rust project. Every crate opts in
# with `[lints] workspace = true`. CI runs Clippy with `-D warnings`, so each
# "warn" below fails the build.
[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
# Safety: prevent panicking in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Correctness
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

# Clarity
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
if_not_else = "warn"
macro_use_imports = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"

# Complexity
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"

# Async
large_futures = "warn"
large_stack_frames = "warn"

# Disallowed methods (configured in clippy.toml)
disallowed_methods = "deny"
