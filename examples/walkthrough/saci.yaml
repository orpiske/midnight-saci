# Walkthrough configuration: a local backend, Podman or Docker workers on
# the host network, the scripted model and the orders service, all on
# loopback. Reference: docs/configuration.md, docs/launchers.md.

backend:
  listen: 127.0.0.1:18080
  data_dir: ./saci-data
  # Workers share the host's network, so loopback reaches the backend.
  worker_url: http://127.0.0.1:18080

worker:
  runtime: auto            # podman if found in PATH, otherwise docker
  image: localhost/saci-worker:latest
  network: host

llm:
  # saci-fake-model answers from playbook.json. For a real provider see
  # docs/walkthrough.md#using-a-real-model.
  base_url: http://127.0.0.1:11435/v1
  model: walkthrough-playbook

limits:
  run_timeout_secs: 900
  step_timeout_secs: 600

environments:
  local:
    description: The walkthrough's orders service on the host.
    parameters:
      SERVICE_URL: http://127.0.0.1:18081

policies:
  default:
    on_failure: stop
