# Saci configuration for a local backend with Podman or Docker workers.
# Reference: docs/configuration.md

backend:
  listen: 127.0.0.1:8080
  data_dir: ./saci-data
  # How workers reach the backend from inside their container.
  worker_url: http://host.containers.internal:8080

worker:
  runtime: auto            # podman if found in PATH, otherwise docker
  image: localhost/saci-worker:latest
  # Docker on Linux needs this to resolve host.containers.internal;
  # Podman provides the name already.
  add_hosts:
    - host.containers.internal:host-gateway

llm:
  # OpenRouter. For a host-local Ollama use
  #   base_url: http://host.containers.internal:11434/v1
  # and omit api_key_env.
  base_url: https://openrouter.ai/api/v1
  model: your-tool-capable-model
  api_key_env: SACI_LLM_API_KEY

limits:
  step_timeout_secs: 300

environments:
  local:
    description: A disposable service on the host.
    parameters:
      SERVICE_URL: http://host.containers.internal:8081
    secrets:
      SERVICE_TOKEN:
        env: SACI_DEMO_SERVICE_TOKEN
    worker:
      cpu: "1"
      memory: 1g

policies:
  default:
    on_failure: stop
  keep-going:
    on_failure: continue
  retry-errors:
    retry:
      max_attempts: 2
      on: [error]
