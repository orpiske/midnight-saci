# Saci configuration for a local backend with Podman or Docker workers.
# Reference: docs/configuration.md

backend:
  listen: 127.0.0.1:8080
  data_dir: ./saci-data
  # How workers reach the backend. Workers share the host's network
  # (worker.network below), so loopback works; for bridged workers see
  # docs/launchers.md#networking.
  worker_url: http://127.0.0.1:8080

worker:
  runtime: auto            # podman if found in PATH, otherwise docker
  image: localhost/saci-worker:latest
  network: host

llm:
  # OpenRouter. For a host-local Ollama use
  #   base_url: http://127.0.0.1:11434/v1
  # and omit api_key.
  base_url: https://openrouter.ai/api/v1
  model: your-tool-capable-model
  api_key: env:SACI_LLM_API_KEY

# Optional: let a TypeSafe System One judge pass steps whose code blocks are
# all marked `run`, without a model request (docs/configuration.md#judge).
# judge:
#   api_key: env:TYPESAFE_API_KEY

limits:
  step_timeout_secs: 300

environments:
  local:
    description: A disposable service on the host.
    parameters:
      SERVICE_URL: http://127.0.0.1:8081
    secrets:
      SERVICE_TOKEN:
        env: SACI_DEMO_SERVICE_TOKEN
    worker:
      cpu: "1"
      memory: 1g

policies:
  default:
    on_failure: stop
  keep-going:
    on_failure: continue
  retry-errors:
    retry:
      max_attempts: 2
      on: [error]
