[package]
name = "saci-worker"
description = "Saci per-run worker: executes a plan with the agent and its tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "saci-worker"
path = "src/main.rs"

# The init blocks signals and reaps every child of the process, so its
# test runs alone in its own process, without the test harness.
[[test]]
name = "worker_init"
harness = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
http.workspace = true
nix.workspace = true
clap = { workspace = true, features = ["env"] }
saci-core.workspace = true
saci-mcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
time.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rig.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum.workspace = true
saci-backend.workspace = true
saci-testkit.workspace = true
