[package]
name = "saci-julia"
description = "Optional Saci module: runs the Julia 1 decision model as a System One judge service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "saci-julia"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["download-binaries"]
# Link a prebuilt ONNX Runtime that the build downloads (the usual setup).
download-binaries = ["ort/download-binaries"]
# Load ONNX Runtime at run time from ORT_DYLIB_PATH instead, for hosts that
# cannot download it at build time.
load-dynamic = ["ort/load-dynamic"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
ort.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The TypeSafe client of the Saci judge, to test the wire format.
rig.workspace = true
reqwest.workspace = true
tempfile.workspace = true
