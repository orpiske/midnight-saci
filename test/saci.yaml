# Configuration for the Saci that runs the self-test plans in test/plans/.
# It listens on 127.0.0.1:8080, needs a real, tool-capable model and requires
# a client token. The saci-under-test environment points the plans at this
# same backend. To test a second Saci, such as the one test/start-under-test.sh
# starts on 127.0.0.1:18080, change UNDER_TEST_URL and UNDER_TEST_TOKEN.
# Reference: docs/configuration.md, test/README.md.

backend:
  listen: 127.0.0.1:8080
  data_dir: ./saci-self-test-data
  # Workers share the host's network, so loopback reaches this backend and
  # the backend under test.
  worker_url: http://host.docker.internal:8080
  # Clients send the token in SACI_TOKEN. The saci-under-test environment
  # gives the same token to the plans as UNDER_TEST_TOKEN, so the plans can
  # also test this backend.
  auth:
    token_env: SACI_TOKEN

worker:
  runtime: auto            # podman if found in PATH, otherwise docker
  image: localhost/saci-worker:latest
  network: host

llm:
  # OpenRouter. For a host-local Ollama use
  #   base_url: http://127.0.0.1:11434/v1
  # and omit api_key_env.
  base_url: https://openrouter.ai/api/v1
  model: z-ai/glm-5.3-flash
  api_key_env: SACI_LLM_API_KEY

limits:
  run_timeout_secs: 1800
  step_timeout_secs: 300

environments:
  saci-under-test:
    description: This Saci, tested by itself.
    parameters:
      UNDER_TEST_URL: http://host.docker.internal:8080
      UNDER_TEST_ENVIRONMENT: saci-under-test
      SERVICE_URL: http://host.docker.internal:18081
    secrets:
      # The client token of the backend under test. When it is a different
      # backend, use the variable that holds its token.
      UNDER_TEST_TOKEN: { env: SACI_TOKEN }

policies:
  # Keep going after a failed test, so one failure does not hide the rest.
  default:
    on_failure: continue
