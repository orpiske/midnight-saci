# Weekly dependency updates (docs/contributing/releases.md#dependency-updates).
# Minor and patch updates of one ecosystem come in one pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # openapi-typescript 7 needs the peer typescript 5. Remove this entry
      # when openapi-typescript accepts typescript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /examples/kubernetes
    schedule:
      interval: weekly
