name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked --workspace
      - name: Test
        run: cargo test --locked --workspace

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the worker image
        run: docker build -f Containerfile -t localhost/saci-worker:ci .
      - name: Run a fixture-backed plan in the image
        env:
          SACI_WORKER_IMAGE: localhost/saci-worker:ci
        run: cargo test --locked --package saci-worker --test worker_bootstrap
      - name: Launch the image from the backend with Docker
        env:
          SACI_WORKER_IMAGE: localhost/saci-worker:ci
          SACI_CONTAINER_RUNTIME: docker
        run: cargo test --locked --package saci-backend --test container_launcher
      - name: Run the walkthrough with Docker
        env:
          IMAGE: localhost/saci-worker:ci
          RUNTIME: docker
        run: |
          cargo build --locked --package saci-cli --package saci-testkit
          examples/walkthrough/walkthrough.sh
      - name: Launch the image from the backend with Podman
        env:
          SACI_WORKER_IMAGE: localhost/saci-worker:ci
          SACI_CONTAINER_RUNTIME: podman
        run: |
          podman --version
          docker save localhost/saci-worker:ci | podman load
          cargo test --locked --package saci-backend --test container_launcher the_backend_launches_the_real_image

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the worker image
        run: docker build -f Containerfile -t localhost/saci-worker:ci .
      - name: Create a kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: saci
      - name: Load the image and prepare a namespace
        run: |
          kind load docker-image localhost/saci-worker:ci --name saci
          kubectl create namespace saci-test
          kubectl proxy --port=8001 &
          sleep 2
          gateway=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Subnet | contains(".")) | .Gateway')
          echo "SACI_HOST_ADDRESS=$gateway" >> "$GITHUB_ENV"
      - name: Run and cancel Jobs from the backend
        env:
          SACI_KUBERNETES_API: http://127.0.0.1:8001
          SACI_KUBERNETES_NAMESPACE: saci-test
          SACI_WORKER_IMAGE: localhost/saci-worker:ci
        run: cargo test --locked --package saci-backend --test kubernetes_launcher a_real_cluster
      - name: Check the Helm chart
        run: |
          helm lint deploy/helm/saci
          cargo test --locked --package saci-backend --test helm_chart
      - name: Install the chart and upgrade it
        run: |
          helm install saci deploy/helm/saci --namespace saci-test --wait --timeout 3m \
            --set image.repository=localhost/saci-worker --set image.tag=ci --set image.pullPolicy=Never \
            --set llm.baseUrl=http://$SACI_HOST_ADDRESS:11435/v1 --set llm.model=scripted
          token=$(kubectl -n saci-test get secret saci-auth -o jsonpath='{.data.token}' | base64 -d)
          kubectl -n saci-test port-forward svc/saci 18080:8080 &
          sleep 3
          curl -fsS http://127.0.0.1:18080/api/v1/health
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:18080/api/v1/runs
          helm upgrade saci deploy/helm/saci --namespace saci-test --reuse-values --wait --timeout 3m \
            --set config.limits.run_timeout_secs=1200
          kubectl -n saci-test rollout status deployment/saci
          test "$(kubectl -n saci-test get pods -l app.kubernetes.io/component=backend -o name | wc -l)" = 1
          test "$(kubectl -n saci-test get secret saci-auth -o jsonpath='{.data.token}' | base64 -d)" = "$token"
      - name: Show the namespace on failure
        if: failure()
        run: |
          kubectl -n saci-test get all,jobs,secrets,pvc -o wide
          kubectl -n saci-test describe pods
          kubectl -n saci-test logs deployment/saci --tail=100 || true
