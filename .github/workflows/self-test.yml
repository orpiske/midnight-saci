name: Self-test

# Runs Saci's own test plans (test/plans) end to end with the TypeSafe
# judge, and with a model when SACI_LLM_API_KEY is set. See test/README.md.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plans:
    # Pull requests from forks and from Dependabot get no secrets.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SACI_LLM_API_KEY: ${{ secrets.SACI_LLM_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SACI_LLM_BASE_URL: ${{ vars.SACI_LLM_BASE_URL }}
      SACI_LLM_MODEL: ${{ vars.SACI_LLM_MODEL }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::error::The repository secret TYPESAFE_API_KEY is not set."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the worker image
        run: docker build -f Containerfile --build-arg SACI_BUILD_COMMIT=${{ github.sha }} -t localhost/saci-worker:ci .
      - name: Build the CLI and the fixtures
        run: cargo build --locked --package saci-cli --package saci-testkit
      - name: Run the plans
        env:
          IMAGE: localhost/saci-worker:ci
          RUNTIME: docker
          WORK: ${{ runner.temp }}/self-test
        run: test/run-self-tests.sh
      - name: Upload the reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-test-reports
          path: |
            ${{ runner.temp }}/self-test/reports/
            ${{ runner.temp }}/self-test/*.log
            ${{ runner.temp }}/self-test/under-test/*.log
          if-no-files-found: ignore
